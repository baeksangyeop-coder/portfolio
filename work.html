<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 제목은 case.js가 작업 이름으로 바꿔 넣음 -->
  <title>작업 | BAEK SANGYEOP</title>
  <meta name="description" content="AI를 활용해 실제로 쓰이는 도구를 만드는 디자이너 BAEK SANGYEOP의 작업 상세 페이지입니다.">
  <meta name="theme-color" content="#0E0F11">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="BAEK SANGYEOP">
  <meta property="og:title" content="작업 | BAEK SANGYEOP">
  <meta property="og:description" content="AI를 활용해 실제로 쓰이는 도구를 만드는 디자이너 BAEK SANGYEOP의 작업 상세 페이지입니다.">
  <meta property="og:image" content="https://baek-sangyeop.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 미리 연결: 글꼴 파일(crossorigin)과 CSS·스크립트(일반)는 연결이 따로라 둘 다 엶 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <!-- 글꼴 CSS는 화면 그리기를 막지 않게 따로 받음 (받는 동안은 시스템 글꼴로 먼저 보임).
       상세 페이지는 외부 서버 연결 때문에 첫 글자가 늦게 뜨던 문제가 있어서 이렇게 함 -->
  <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
  <link rel="stylesheet" href="style.css">

  <!-- 순서 중요: 라이브러리 → works.js(데이터) → script.js(공통 동작) → case.js(이 페이지 그리기)
       GSAP은 첫 화면 연출에만 쓰여서 이 페이지에서는 불러오지 않음 (내용이 더 빨리 그려짐).
       script.js는 GSAP이 없으면 Lenis를 자체 반복으로 돌림 -->
  <script src="vendor/lenis.min.js" defer></script>
  <script src="works.js" defer></script>
  <script src="script.js" defer></script>
  <script src="case.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="index.html" aria-label="BAEK SANGYEOP, 첫 화면으로"><span class="brand__text">BAEK SANGYEOP</span></a>

      <button class="nav-toggle" type="button"
              aria-expanded="false" aria-controls="site-nav" aria-label="메뉴 열기">
        <span class="nav-toggle__bars" aria-hidden="true"></span>
      </button>

      <nav id="site-nav" class="site-nav" aria-label="주요 메뉴">
        <ul>
          <li><a href="index.html#works">작업</a></li>
          <li><a href="index.html#about">소개</a></li>
          <li><a href="index.html#contact">연락</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- 이 안은 case.js가 주소의 ?id= 값에 맞는 작업으로 채움 -->
    <article class="wrap case" id="case">
      <p class="case__loading">작업을 불러오는 중입니다.</p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2026 Baek Sangyeop</p>
    </div>
  </footer>
</body>
</html>
